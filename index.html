<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Formicide — Ant Colony RTS</title>
<meta name="description" content="A browser real-time strategy game of rival ant colonies, with a campaign, skirmish AI, heroes, superweapons and weather.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="top">
    <div class="res" title="Food"><i class="ico f"></i><span class="lbl">Food</span><b id="food">0</b></div>
    <div class="res" title="Honeydew"><i class="ico h"></i><span class="lbl">Honey</span><b id="honey">0</b></div>
    <div class="res" title="Supply used / available"><span class="lbl">Supply</span><b id="pop">0</b><span class="lbl sl">/</span><span class="lbl sl" id="cap">20</span></div>
    <div class="res" id="clock">0:00</div>
    <div id="spires"></div>
    <div class="spacer"></div>
    <button id="bBox" class="tb" title="Drag to select a group">⬚ Box</button>
    <button id="bArmy" class="tb" title="Select all fighters">Army</button>
    <button id="bIdle" class="tb" title="Select idle workers">Idle</button>
    <button id="bNest" class="tb" title="Jump to your nest">Nest</button>
    <button id="bSound" class="tb" title="Mute or unmute">🔊</button>
    <button id="bMenu" class="tb" title="Menu (Esc)">☰</button>
  </div>
  <div id="obj" class="hide" title="Click to collapse"></div>
  <canvas id="mini"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="hint"></div>
  <div id="groups"></div>
  <div id="panel"><div id="info"></div><div id="cmds"></div></div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>
<script src="js/data.js?v=10"></script>
<script src="js/audio.js?v=10"></script>
<script src="js/map.js?v=10"></script>
<script src="js/sim.js?v=10"></script>
<script src="js/ai.js?v=10"></script>
<script src="js/render.js?v=10"></script>
<script src="js/input.js?v=10"></script>
<script src="js/ui.js?v=10"></script>
<script src="js/campaign.js?v=10"></script>
<script src="js/main.js?v=10"></script>
</body>
</html>
